---
- name: Install and configure Netdata monitoring
  hosts: vpn_server
  become: true
  tasks:
    - name: Download Netdata install script
      get_url:
        url: https://get.netdata.cloud/kickstart.sh
        dest: /tmp/netdata-kickstart.sh
        mode: "0755"

    - name: Run Netdata install script (non-interactive)
      shell: /tmp/netdata-kickstart.sh --non-interactive
      args:
        creates: /opt/netdata/bin/netdata

    - name: Allow Netdata dashboard port through iptables (SSH access only, via tunnel)
      iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "19999"
        source: "127.0.0.1"
        jump: ACCEPT
        action: insert
        rule_num: 1

    - name: Install iptables-persistent to save rules across reboots
      apt:
        name: iptables-persistent
        state: present
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Save current iptables rules
      shell: netfilter-persistent save
