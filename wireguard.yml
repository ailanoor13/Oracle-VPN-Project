---
- name: Install and configure WireGuard
  hosts: vpn_server
  become: true
  tasks:
    - name: Install WireGuard
      apt:
        name: wireguard
        state: present
        update_cache: true
    - name: Enable IP forwarding
      sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_set: true
        state: present
        reload: true
    - name: Allow WireGuard UDP port through iptables
      iptables:
        chain: INPUT
        protocol: udp
        destination_port: "51820"
        jump: ACCEPT
        action: insert
        rule_num: 1
    - name: Allow forwarding of traffic coming in from wg0
      iptables:
        chain: FORWARD
        in_interface: wg0
        jump: ACCEPT
        action: insert
        rule_num: 1
    - name: Allow forwarding of traffic going out to wg0
      iptables:
        chain: FORWARD
        out_interface: wg0
        jump: ACCEPT
        action: insert
        rule_num: 1
    - name: Install iptables-persistent to save rules across reboots
      apt:
        name: iptables-persistent
        state: present
      environment:
        DEBIAN_FRONTEND: noninteractive
    - name: Save current iptables rules
      shell: netfilter-persistent save
    - name: Generate and save WireGuard private key
      shell: umask 077 && wg genkey > /etc/wireguard/privatekey
      args:
        creates: /etc/wireguard/privatekey
    - name: Get private key content
      command: cat /etc/wireguard/privatekey
      register: private_key_content
      changed_when: false
    - name: Generate WireGuard public key
      shell: "echo '{{ private_key_content.stdout }}' | wg pubkey"
      register: wg_public_key
      changed_when: false
    - name: Create WireGuard config file
      copy:
        dest: /etc/wireguard/wg0.conf
        mode: "0600"
        content: |
          [Interface]
          PrivateKey = {{ private_key_content.stdout }}
          Address = 10.10.10.1/24
          ListenPort = 51820
          PostUp = iptables -t nat -A POSTROUTING -o ens3 -j MASQUERADE
          PostDown = iptables -t nat -D POSTROUTING -o ens3 -j MASQUERADE
    - name: Start and enable WireGuard service
      systemd:
        name: wg-quick@wg0
        enabled: true
        state: started
    - name: Add laptop as authorized WireGuard peer
      lineinfile:
        path: /etc/wireguard/wg0.conf
        line: |
          [Peer]
          PublicKey = {{ vault_laptop_public_key }}
          AllowedIPs = 10.10.10.2/32
      notify: restart wireguard
  handlers:
    - name: restart wireguard
      systemd:
        name: wg-quick@wg0
        state: restarted
